// Update manifest - upload to /motd/darkreign2/downloads/updates.cfg
//
// This one file is read by two different generations of client:
//
//   1.458 and earlier  over plain HTTP on port 80, during the transition
//                      window (see docs/update-system.md). They ignore Hash,
//                      which they never look for.
//
//   1.459 and later    over TLS on port 443, and they refuse any patch whose
//                      Hash is missing or does not match.
//
// DefaultSource has been REMOVED from the 1.458 version of this file, and must
// stay removed. It forced one host and port on every client, and the two
// generations need different ports - 458 cannot speak TLS and 459 will not
// speak anything else. With no DefaultSource each client downloads patches
// from whatever its own download.cfg already says, which is right for both.
// Its old value was the same host and path the 458 clients are configured with
// anyway, so dropping it changes nothing for them.
//
// Patches are listed newest first. This is load-bearing: the client takes the
// first entry that applies, not the best one. Always prepend.
//

CurrentVersion(145900, 0);

// Size and Hash are of dr2_145900.exe as built. If the installer is recompiled
// for any reason, both must be recomputed - a Hash that does not match the file
// on the server fails closed, and 459 clients will refuse the update:
//
//   (Get-Item dr2_145900.exe).Length
//   (Get-FileHash dr2_145900.exe -Algorithm SHA256).Hash.ToLower()
Patch(145800, 0, "English")
{
    Size(2337929);
    Hash("a7070572747da079ff4264d14b6a19afb82cf7e92329c11d163c2bb1443aa0a4");
    File("downloads/dr2_145900.exe");
}

// The existing chain, unchanged. No Hash on these: the clients that consume
// them predate the check and would ignore it, and no 459 client will ever ask
// for one, being current already.
Patch(145700, 0, "English")
{
    Size(0);
    File("downloads/dr2_145800.exe");
}

Patch(145600, 0, "English")
{
    Size(0);
    File("downloads/dr2_145700.exe");
}

Patch(145500, 0, "English")
{
    Size(0);
    File("downloads/dr2_145600.exe");
}

Patch(145400, 0, "English")
{
    Size(0);
    File("downloads/dr2_145500.exe");
}

