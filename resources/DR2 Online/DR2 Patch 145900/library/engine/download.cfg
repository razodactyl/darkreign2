// Download information
//
// Ships with 1.459. Two things changed from the 1.458 file:
//
//   - Port 443. Every download is TLS now; the transport has no plaintext path
//     left in it, so a Source on port 80 simply fails rather than downgrading.
//
//   - Fallback. Tried once, after the primary fails to answer or to resolve, so
//     that the update mechanism outlives the domain it was first published on.
//     dr2.bytebreeze.me is not serving yet - it is here so that clients already
//     in the field know where to look on the day it is.
//
// See docs/update-system.md.
//

Source("dr2.mintsoft.dev", 443, "/motd/darkreign2/");
Fallback("dr2.bytebreeze.me", 443, "/motd/darkreign2/");
FileUpdates("downloads/updates.cfg");
FileMotd("downloads/motd.cfg");
